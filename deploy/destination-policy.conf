# Dohcord-relay - which TCP ports each allowlisted domain may use
#
# Path on the server: /etc/dohcord-relay/destination-policy.conf
#
# Format, one domain per line:
#
#   <domain> <port>[,<port>|<from>-<to> ...]
#
# The domain must also appear in allowed-domains.txt, and every domain in that
# file must have a line here. Ports are the ports of the CONNECT destination;
# they are not listener ports on this server.
#
# Why discord.media needs a wide range: Discord sends the client a dynamically
# assigned voice server such as "sweetwater-12345.discord.media" and the client
# connects with wss:// to the exact port Discord supplies (seen in the wild above
# 1024). That port changes per call and per region, so it cannot be a fixed
# number. Only discord.media gets this range - no other destination does.
#
# After editing, run:
#   sudo dohcord-relay -policy-apply -config /etc/dohcord-relay/config.env

discord.com       443
discord.gg        443
discordapp.com    443
discordapp.net    443
discord.media     443,1024-65535
